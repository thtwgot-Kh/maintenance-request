<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบแจ้งซ่อมเครื่องจักร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1F2C3B;
    --navy-2:#28394d;
    --amber:#E8A33D;
    --amber-dark:#c17f1e;
    --paper:#F5F2EA;
    --card:#FFFFFF;
    --ink:#232323;
    --slate:#6b7785;
    --slate-light:#98a2ac;
    --success:#2F8F6B;
    --success-bg:#e6f3ee;
    --danger:#B5433A;
    --danger-bg:#fbeae8;
    --line:#dfd8c8;
    --warn:#c17f1e;
    --warn-bg:#fbf0dd;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Sarabun',sans-serif; font-size:15px; line-height:1.5;
    min-height:100vh;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  header.topbar{
    background:var(--navy); color:#fff; padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    border-bottom:4px solid var(--amber);
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .logo{
    width:34px; height:34px; border-radius:7px; background:var(--amber);
    display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--navy); font-size:16px;
    transform:rotate(-4deg);
  }
  .brand h1{font-size:16px; margin:0; font-weight:600;}
  .brand .sub{font-size:11.5px; color:#b9c3cd; margin-top:1px;}
  .role-select{display:flex; align-items:center; gap:8px; font-size:13px; color:#d9dfe5;}
  .role-select select{
    background:var(--navy-2); color:#fff; border:1px solid #3c5064; border-radius:6px;
    padding:7px 10px; font-family:'Sarabun',sans-serif; font-size:13.5px; cursor:pointer;
  }
  nav.tabs{
    display:flex; gap:2px; background:var(--navy-2); padding:0 14px; overflow-x:auto;
  }
  nav.tabs button{
    background:none; border:none; color:#c3ccd4; padding:12px 16px; font-family:'Sarabun',sans-serif;
    font-size:14px; cursor:pointer; border-bottom:3px solid transparent; white-space:nowrap; position:relative;
  }
  nav.tabs button.active{color:#fff; border-bottom-color:var(--amber); font-weight:600;}
  nav.tabs button .badge{
    background:var(--amber); color:var(--navy); border-radius:20px; font-size:10.5px; font-weight:700;
    padding:1px 6px; margin-left:6px;
  }
  main{max-width:920px; margin:0 auto; padding:22px 16px 80px;}
  h2.view-title{font-size:19px; margin:0 0 4px; font-weight:700; color:var(--navy);}
  p.view-sub{color:var(--slate); font-size:13.5px; margin:0 0 20px;}
  .card{background:var(--card); border-radius:10px; padding:20px; box-shadow:0 1px 3px rgba(31,44,59,0.08); border:1px solid #ece6d8;}
  label.field-label{display:block; font-size:13px; font-weight:600; color:var(--navy); margin-bottom:6px;}
  .req-star{color:var(--danger);}
  select.input, input.input, textarea.input{
    width:100%; padding:10px 12px; border-radius:7px; border:1.5px solid var(--line); background:#fff;
    font-family:'Sarabun',sans-serif; font-size:14px; color:var(--ink);
  }
  select.input:focus, input.input:focus, textarea.input:focus{outline:none; border-color:var(--amber-dark);}
  textarea.input{resize:vertical; min-height:80px;}
  .field{margin-bottom:18px;}
  .dept-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:10px;}
  .dept-btn{
    border:2px solid var(--line); background:#fff; border-radius:9px; padding:14px 8px; cursor:pointer;
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:17px; color:var(--navy);
    text-align:center; transition:all .12s;
  }
  .dept-btn:hover{border-color:var(--amber-dark);}
  .dept-btn.selected{background:var(--navy); border-color:var(--navy); color:#fff;}
  .dept-btn .full-name{display:block; font-family:'Sarabun',sans-serif; font-weight:400; font-size:11px; margin-top:3px; opacity:.85;}
  .docnum-box{
    display:flex; align-items:center; gap:12px; background:var(--paper); border:1px dashed var(--amber-dark);
    border-radius:8px; padding:12px 16px; margin-bottom:18px;
  }
  .doc-chip{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:18px; background:#fff;
    border:2px dashed var(--amber-dark); padding:5px 12px; border-radius:4px; transform:rotate(-2deg);
    display:inline-block; color:var(--navy); box-shadow:1px 1px 0 rgba(0,0,0,.05);
  }
  .docnum-box .hint{font-size:12.5px; color:var(--slate);}
  .search-wrap{position:relative;}
  .search-results{
    position:absolute; z-index:20; top:calc(100% + 4px); left:0; right:0; background:#fff;
    border:1.5px solid var(--line); border-radius:8px; max-height:220px; overflow-y:auto;
    box-shadow:0 6px 18px rgba(0,0,0,.12);
  }
  .search-item{padding:10px 12px; cursor:pointer; border-bottom:1px solid #f0ece1; font-size:13.5px;}
  .search-item:last-child{border-bottom:none;}
  .search-item:hover{background:var(--paper);}
  .search-item b.code{font-family:'JetBrains Mono',monospace; color:var(--navy);}
  .selected-machine{
    margin-top:8px; background:var(--success-bg); border:1px solid #bfe0d1; border-radius:7px;
    padding:9px 12px; font-size:13.5px; display:flex; justify-content:space-between; align-items:center;
  }
  .selected-machine button{background:none;border:none;color:var(--danger);cursor:pointer;font-size:12.5px;font-family:'Sarabun',sans-serif;}
  .photo-drop{
    border:2px dashed var(--line); border-radius:9px; padding:18px; text-align:center; cursor:pointer; color:var(--slate); font-size:13.5px;
  }
  .photo-drop:hover{border-color:var(--amber-dark); color:var(--amber-dark);}
  .photo-thumbs{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .photo-thumb{position:relative; width:74px; height:74px; border-radius:7px; overflow:hidden; border:1px solid var(--line);}
  .photo-thumb img{width:100%; height:100%; object-fit:cover;}
  .photo-thumb .rm{
    position:absolute; top:2px; right:2px; background:rgba(0,0,0,.6); color:#fff; border:none; border-radius:50%;
    width:18px; height:18px; font-size:11px; cursor:pointer; line-height:18px; padding:0;
  }
  .btn{
    border:none; border-radius:8px; padding:11px 20px; font-family:'Sarabun',sans-serif; font-weight:600; font-size:14px;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  }
  .btn-primary{background:var(--amber); color:var(--navy);}
  .btn-primary:hover{background:var(--amber-dark); color:#fff;}
  .btn-primary:disabled{background:#e4dcc8; color:#a99f86; cursor:not-allowed;}
  .btn-outline{background:#fff; border:1.5px solid var(--line); color:var(--navy);}
  .btn-outline:hover{border-color:var(--navy);}
  .btn-success{background:var(--success); color:#fff;}
  .btn-danger-outline{background:#fff; border:1.5px solid var(--danger); color:var(--danger);}
  .btn-danger-outline:hover{background:var(--danger-bg);}
  .btn-sm{padding:7px 13px; font-size:12.5px; border-radius:6px;}
  .btn-block{width:100%; justify-content:center;}

  /* order ticket card */
  .order-card{
    background:var(--card); border-radius:9px; padding:16px 16px 16px 20px; margin-bottom:12px;
    border:1px solid #ece6d8; position:relative; box-shadow:0 1px 2px rgba(31,44,59,.06);
    border-left-width:6px; border-left-style:solid;
  }
  .order-card::before, .order-card::after{
    content:''; position:absolute; left:-7px; width:14px; height:14px; border-radius:50%;
    background:var(--paper); border:1px solid #ece6d8;
  }
  .order-card::before{top:-7px;}
  .order-card::after{bottom:-7px;}
  .order-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;}
  .order-meta{font-size:12px; color:var(--slate); margin-top:4px;}
  .status-pill{
    font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:20px; white-space:nowrap;
  }
  .order-body{margin-top:10px; font-size:13.5px;}
  .order-body .cause{color:var(--ink); margin-top:4px;}
  .order-actions{margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;}
  .filters{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .filters select{font-size:13px; padding:8px 10px;}
  .empty-state{text-align:center; padding:50px 20px; color:var(--slate);}
  .empty-state .big{font-size:34px; margin-bottom:8px;}

  /* detail view */
  .back-link{background:none;border:none;color:var(--navy); cursor:pointer; font-size:13.5px; font-weight:600; margin-bottom:14px; display:inline-flex; align-items:center; gap:5px; padding:0;}
  .detail-head{display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px; margin-bottom:16px;}
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(max-width:600px){.grid-2{grid-template-columns:1fr;}}
  .kv{margin-bottom:10px;}
  .kv .k{font-size:11.5px; color:var(--slate); text-transform:uppercase; letter-spacing:.4px;}
  .kv .v{font-size:14px; margin-top:2px;}
  .timeline{margin-top:6px; border-left:2px solid var(--line); padding-left:16px;}
  .timeline-item{position:relative; padding-bottom:16px; font-size:13px;}
  .timeline-item::before{content:''; position:absolute; left:-21px; top:3px; width:9px; height:9px; border-radius:50%; background:var(--amber-dark);}
  .timeline-item .t-time{color:var(--slate); font-size:11.5px;}
  .gallery{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;}
  .gallery img{width:100px; height:100px; object-fit:cover; border-radius:7px; border:1px solid var(--line); cursor:pointer;}
  .action-box{background:var(--paper); border:1px solid var(--line); border-radius:9px; padding:16px; margin-top:16px;}
  .action-box h4{margin:0 0 10px; font-size:14px; color:var(--navy);}
  .reject-box{margin-top:10px; background:#fff; border:1px solid var(--line); border-radius:7px; padding:12px;}

  .update-banner{
    background:var(--warn-bg); color:var(--warn); border-bottom:2px solid var(--warn);
    padding:10px 20px; display:flex; align-items:center; justify-content:center; gap:12px;
    font-size:13.5px; font-weight:600; flex-wrap:wrap; text-align:center;
  }

  /* notifications */
  .notif-item{display:flex; gap:12px; padding:13px 14px; border-radius:8px; margin-bottom:8px; background:#fff; border:1px solid #ece6d8;}
  .notif-item.unread{background:#fffaf0; border-color:var(--amber);}
  .notif-icon{width:34px; height:34px; border-radius:50%; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0;}
  .notif-text{font-size:13.5px;}
  .notif-time{font-size:11px; color:var(--slate); margin-top:2px;}

  /* settings */
  .settings-section{margin-bottom:26px;}
  .settings-section h3{font-size:15px; color:var(--navy); margin:0 0 4px;}
  .settings-section .desc{font-size:12.5px; color:var(--slate); margin:0 0 12px;}
  table.mini{width:100%; border-collapse:collapse; font-size:13px;}
  table.mini th{text-align:left; font-size:11.5px; color:var(--slate); text-transform:uppercase; padding:6px 8px; border-bottom:1.5px solid var(--line);}
  table.mini td{padding:8px; border-bottom:1px solid #f0ece1; vertical-align:middle;}
  table.mini td .del{background:none; border:none; color:var(--danger); cursor:pointer; font-size:12px;}
  .inline-form{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .inline-form input, .inline-form select{flex:1; min-width:100px;}
  .note-box{background:var(--warn-bg); border:1px solid #e6cd9c; border-radius:8px; padding:12px 14px; font-size:12.5px; color:#7a5a13; margin-bottom:18px;}
  .summary-stats{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden;}
  .summary-stats .stat{flex:1; padding:12px 10px; text-align:center; border-right:1px solid var(--line);}
  .summary-stats .stat:last-child{border-right:none;}
  .summary-stats .stat .num{font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700; color:var(--navy);}
  .summary-stats .stat .lbl{font-size:11px; color:var(--slate); margin-top:2px;}
  .summary-link{
    display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px;
    background:var(--paper); border:1px dashed var(--amber-dark); border-radius:8px; padding:11px 13px;
  }
  .summary-link .txt{font-size:12.5px; color:var(--ink);}
  .summary-link .txt b{color:var(--navy);}
  .summary-link a{font-size:12px; font-weight:700; color:var(--amber-dark); text-decoration:none; white-space:nowrap;}
  .summary-link a:hover{text-decoration:underline;}
  .info-toggle{margin-bottom:10px;}
  .info-toggle summary{
    cursor:pointer; font-size:12.5px; color:var(--amber-dark); font-weight:600; list-style:none;
  }
  .info-toggle summary::-webkit-details-marker{display:none;}
  .info-toggle summary::before{content:'ℹ️ '; }
  .info-toggle p{margin-top:8px;}

  .toast-wrap{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:999; display:flex; flex-direction:column; gap:8px; align-items:center;}
  .toast{background:var(--navy); color:#fff; padding:11px 20px; border-radius:8px; font-size:13.5px; box-shadow:0 6px 20px rgba(0,0,0,.2); animation:toastin .18s ease-out;}
  .toast.err{background:var(--danger);}
  @keyframes toastin{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:#cfc7b2; border-radius:8px;}
</style>
</head>
<body>
<div id="app">กำลังตรวจสอบสิทธิ์ผู้ใช้งาน…</div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ============================= CONFIG / CONSTANTS ============================= */
const ROLES = {
  requester: { label:'ผู้แจ้งซ่อม', icon:'📝' },
  fm:        { label:'ผู้จัดการโรงงาน (อนุมัติ 1)', icon:'🏭' },
  gm:        { label:'ผู้จัดการทั่วไป (อนุมัติ 2)', icon:'🗂️' },
  maint:     { label:'ผู้จัดการแผนกซ่อมบำรุง', icon:'🔧' },
  tech:      { label:'ช่าง', icon:'🧰' },
  admin:     { label:'ผู้ดูแลระบบ (ตั้งค่า)', icon:'⚙️' },
};
// admin เป็น super-role — เข้าถึงฟังก์ชันของทุกบทบาทได้โดยไม่ต้องมีแถวสิทธิ์แยกในชีต
// "สิทธิ์ผู้ใช้ LINE" ทุกจุดที่เช็ค state.role===<role> เพื่อโชว์ปุ่ม/กล่องการทำงานของบทบาทนั้น
// ให้เรียก hasRole(<role>) แทน ส่วนการ "ตัดสินใจว่าจะรันฟังก์ชันไหน" (เช่นใน confirmAction)
// ต้องอิงจากสถานะใบแจ้งซ่อม ไม่ใช่ state.role ตรงๆ เพราะ admin ผ่าน hasRole ได้ทุกบทบาทพร้อมกัน
function hasRole(role){ return state.role === role || state.role === 'admin'; }
const STATUS_META = {
  PENDING_FM:    { label:'รออนุมัติ (ผจก.โรงงาน)', color:'#c17f1e', bg:'#fbf0dd' },
  PENDING_GM:    { label:'รออนุมัติ (ผจก.ทั่วไป)',  color:'#c17f1e', bg:'#fbf0dd' },
  NEEDS_INFO_FM: { label:'ต้องการข้อมูลเพิ่มเติม (ผจก.โรงงาน)', color:'#6b4fa0', bg:'#f1ecf8' },
  NEEDS_INFO_GM: { label:'ต้องการข้อมูลเพิ่มเติม (ผจก.ทั่วไป)', color:'#6b4fa0', bg:'#f1ecf8' },
  PENDING_ASSIGN:{ label:'รอมอบหมายช่าง',           color:'#2a6f97', bg:'#e4f0f7' },
  ASSIGNED:      { label:'รอดำเนินการ',             color:'#6b7785', bg:'#eef0f2' },
  IN_PROGRESS:   { label:'กำลังซ่อม',               color:'#1F2C3B', bg:'#e6ecf1' },
  PENDING_VERIFY:{ label:'รอผู้แจ้งตรวจสอบผลการซ่อม', color:'#6b4fa0', bg:'#f1ecf8' },
  DONE:          { label:'ซ่อมเรียบร้อย',            color:'#2F8F6B', bg:'#e6f3ee' },
  REJECTED:      { label:'ไม่อนุมัติ',               color:'#B5433A', bg:'#fbeae8' },
};
const VERIFY_RESULT_META = {
  pass: 'ผ่าน — ใช้งานได้ปกติ',
  fail: 'ไม่ผ่าน — ต้องซ่อมเพิ่มเติม',
};
const DEPT_DEFAULT = [
  { code:'RB', name:'Rubber (RB)' },
  { code:'GR', name:'Grinding (GR)' },
  { code:'QA', name:'Quality Assurance (QA)' },
  { code:'BG', name:'Bagging (BG)' },
];
const MACHINES_DEFAULT = [
  { code:'RB-01', name:'เครื่องรีดยาง 1', dept:'RB' },
  { code:'RB-02', name:'เครื่องรีดยาง 2', dept:'RB' },
  { code:'RB-03', name:'เครื่องอบยาง', dept:'RB' },
  { code:'GR-01', name:'เครื่องบดวัตถุดิบ 1', dept:'GR' },
  { code:'GR-02', name:'เครื่องบดวัตถุดิบ 2', dept:'GR' },
  { code:'QA-01', name:'เครื่องทดสอบแรงดึง', dept:'QA' },
  { code:'QA-02', name:'เครื่องชั่งน้ำหนักดิจิทัล', dept:'QA' },
  { code:'BG-01', name:'เครื่องบรรจุถุง 1', dept:'BG' },
  { code:'BG-02', name:'เครื่องบรรจุถุง 2', dept:'BG' },
];
const TECH_DEFAULT = ['ช่างสมชาย (ไฟฟ้า)', 'ช่างวิชัย (เครื่องกล)', 'ช่างประเสริฐ (ทั่วไป)'];
const DOC_TYPES = { request:'ใบคำร้อง', repair:'ใบแจ้งซ่อม' };
const EXECUTION_PLAN_META = {
  immediate:     'ดำเนินการได้ทันที',
  need_purchase: 'ต้องการสั่งซื้ออุปกรณ์',
  use_existing:  'ใช้อุปกรณ์ที่มีอยู่',
};
const INSPECTOR_OPINION_META = {
  send_repair: 'ส่งซ่อม',
  external:    'เรียกช่างภายนอกมาซ่อม',
  self_repair: 'ซ่อมเอง',
  buy_parts:   'ซื้ออุปกรณ์มาทำเอง',
};

const emptyForm = () => ({ dept:'', docType:'', machineCode:'', machineSearch:'', machineName:'', cause:'', neededDate:'', requestedBy:'', photos:[] });
const emptyPartRow = () => ({ name:'', qty:'', unit:'', price:'', shop:'', note:'' });

let state = {
  role: null,
  allowedRoles: [],
  myTechName: '',
  techIdentities: [],
  deviceId: null,   // รหัสประจำเครื่อง/เบราว์เซอร์ ใช้แทน LINE userId เป็นตัวระบุตัวตน
  didHash: '',      // ลายนิ้วมือ (sha256) ของ deviceId — ใช้เป็นคีย์ค้นสิทธิ์ในคำขอที่อนุมัติแล้ว
  accessRequests: [],
  myRequest: null,
  lineUsers: [],       // ผู้ใช้ LINE ที่ทักเข้ามาหา OA (มาจากแท็บ "LINE Users" ในชีต)
  lineUserRoles: {},   // userId -> { name, roles:[], techName } กำหนดโดย admin ในหน้าตั้งค่า
  authStatus: 'loading', // loading | guest | pending | rejected | ok
  view: 'new',
  config: { departments: DEPT_DEFAULT, machines: MACHINES_DEFAULT, technicians: TECH_DEFAULT, lineWebhooks:{} },
  counters: {},
  orders: [],
  notifications: [],
  loaded: false,
  form: emptyForm(),
  showMachineDropdown: false,
  selectedOrderId: null,
  detailPhotos: [],
  filterStatus: 'ALL',
  filterDept: 'ALL',
  updateAvailable: false,

/* คีย์ใน localStorage ที่เก็บ "รหัสประจำเครื่อง" — ตัวระบุตัวตนของผู้ใช้แทน LINE userId
   (เดิมระบบบังคับล็อกอินผ่าน LINE LIFF ซึ่งใช้ได้เฉพาะเจ้าของ/ผู้ทดสอบของ LINE Login channel

/* บั๊มเลขนี้ทุกครั้งที่แก้ไข index.html — ใช้เทียบกับไฟล์ล่าสุดบนเซิร์ฟเวอร์เพื่อเตือนแท็บที่เปิดค้าง

const APP_VERSION = '2026-08-13.1';

async function storeGet(key){
  try{
    const res = await fetch(API_URL + '?key=' + encodeURIComponent(key));
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    return data.value ? JSON.parse(data.value) : null;
  }catch(e){ console.error('storage get failed', key, e); return undefined; }
}
async function getUserRoles(userId){
  try{
    const res = await fetch(API_URL + '?key=userRoles&userId=' + encodeURIComponent(userId));
    const data = await res.json();
    return data.value ? JSON.parse(data.value) : { roles:[], techNames:[] };
  }catch(e){ return { roles:[], techNames:[] }; }
}
/* ============================= IDENTITY & ACCESS (ไม่ต้องล็อกอิน LINE) =============================
   ใครก็เปิดลิงก์แอปนี้จากเบราว์เซอร์อะไรก็ได้ แล้ว "ขอสิทธิ์" ในหน้าแรก → ผู้ดูแลระบบ (admin) กดอนุมัติ
   และเลือกบทบาทให้ → ผู้ขอเข้าใช้งานได้เองภายในไม่กี่วินาที โดยไม่ต้องล็อกอินซ้ำ

   บทบาทของผู้ใช้หนึ่งคนมาจาก 2 แหล่งรวมกัน (union) — ใช้แหล่งไหนก็ได้:
   1) ชีต "สิทธิ์ผู้ใช้ LINE" (คอลัมน์ userId | บทบาท | ชื่อ) — ผู้ดูแลพิมพ์แถวเองใน Google Sheet
      โดยใส่ "รหัสประจำเครื่อง" (ขึ้นต้นด้วย D-) ลงคอลัมน์ userId ได้ตรงๆ ค้นหาฝั่งเซิร์ฟเวอร์
      ผ่าน doGet('userRoles', ...) เหมือนเดิม (ไม่ต้องแก้ Apps Script)
   2) คำขอสิทธิ์ที่ admin อนุมัติในแอป (KV key 'accessRequests') — กดอนุมัติในหน้าตั้งค่าได้เลย

   หมายเหตุความปลอดภัย: ในคำขอที่เก็บบนเซิร์ฟเวอร์จะบันทึกเฉพาะ "ลายนิ้วมือ" (sha256) ของรหัส
   ประจำเครื่อง ไม่เก็บรหัสตัวจริง เพื่อไม่ให้ผู้ใช้คนอื่นอ่านรายการคำขอแล้วนำรหัสของคนอื่นไปสวมสิทธิ์ */
function randomToken(len){
  const bytes = new Uint8Array(len);
  crypto.getRandomValues(bytes);
  return Array.from(bytes).map(b => b.toString(36).padStart(2,'0')).join('').slice(0, len);
}
function getDeviceId(){
  let id = null;
  try{ id = localStorage.getItem(DEVICE_ID_KEY); }catch(e){ /* โหมดส่วนตัว/บล็อกคุกกี้ */ }
  if(!id){
    id = 'D-' + randomToken(24);
    try{ localStorage.setItem(DEVICE_ID_KEY, id); }catch(e){ /* เก็บไม่ได้ = ต้องขอสิทธิ์ใหม่ทุกครั้ง */ }
  }
  return id;
}
async function sha256Hex(str){
  if(!crypto.subtle) return '';   // ต้องเป็น https เท่านั้น (GitHub Pages เป็น https อยู่แล้ว)
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
function requestFor(hash, list){
  if(!hash) return null;
  return (list || []).find(r => r.didHash === hash) || null;
}
/* รวมบทบาทจากชีต + จากคำขอที่อนุมัติแล้ว แล้วตัดสินว่าเข้าใช้งานได้หรือยัง */
async function resolveAccess(){
  const [sheet, requests] = await Promise.all([
    getUserRoles(state.deviceId),
    storeGet('accessRequests'),
  ]);
  state.accessRequests = Array.isArray(requests) ? requests : [];
  const mine = requestFor(state.didHash, state.accessRequests);
  state.myRequest = mine;

  const roles = [...(sheet.roles || [])];
  const techNames = [...(sheet.techNames || (sheet.techName ? [sheet.techName] : []))];
  if(mine && mine.status === 'approved'){
    (mine.roles || []).forEach(r => roles.push(r));
    if(mine.techName) techNames.push(mine.techName);
  }
  // กรองเฉพาะบทบาทที่ระบบรู้จักจริง — พิมพ์ชื่อบทบาทผิดในชีต (เช่น "Tech") จะได้ไม่ทำให้แอปพัง
  state.allowedRoles = [...new Set(roles.filter(r => ROLES[r]))];
  state.techIdentities = [...new Set(techNames)];
  state.myTechName = state.techIdentities[0] || '';
  if(state.allowedRoles.length){
    state.role = state.allowedRoles[0];
    state.authStatus = 'ok';
  } else if(mine && mine.status === 'pending'){
    state.authStatus = 'pending';
  } else if(mine && mine.status === 'rejected'){
    state.authStatus = 'rejected';
  } else {
    state.authStatus = 'guest';
  }
}
async function authenticate(){
  state.deviceId = getDeviceId();
  state.didHash = await sha256Hex(state.deviceId);
  // หน้าขอสิทธิ์ต้องใช้รายชื่อแผนก/ช่าง และ URL แจ้งเตือน LINE ของ admin จึงต้องโหลด config ก่อนด้วย
  const cfg = await storeGet('config');
  if(cfg) state.config = Object.assign({}, state.config, cfg);
  if(!state.config.lineWebhooks) state.config.lineWebhooks = {};
  await resolveAccess();
}
/* ระหว่างรอผู้ดูแลอนุมัติ ให้เช็คสิทธิ์ซ้ำเป็นระยะ พออนุมัติแล้วจะเข้าระบบให้เองโดยผู้ใช้ไม่ต้องทำอะไร */
async function recheckAccess(){
  if(state.authStatus === 'ok') return;
  const before = state.authStatus;
  await resolveAccess();
  if(state.authStatus === 'ok'){ location.reload(); return; }
  if(state.authStatus !== before) render();
}
/* เขียนรายการคำขอแบบดึงของล่าสุดมาก่อนเสมอ ลดโอกาสที่สองคนกดพร้อมกันแล้วทับกันเอง */
async function saveAccessRequests(mutate){
  const latest = await storeGet('accessRequests');
  const list = (Array.isArray(latest) ? latest : state.accessRequests).slice();
  const next = mutate(list);
  if(!next) return false;
  const ok = await storeSet('accessRequests', next);
  if(ok) state.accessRequests = next;
  return ok;
}
async function submitAccessRequest(){
  const u = state.ui;

  if(!name){ toast('กรุณากรอกชื่อ-นามสกุล', true); return; }
  if(!ROLES[u.reqRole] || u.reqRole === 'admin'){ toast('กรุณาเลือกบทบาทที่ต้องการ', true); return; }
  if(u.reqRole === 'tech' && !u.reqTechName){ toast('กรุณาเลือกชื่อช่างของท่าน', true); return; }
  if(!state.didHash){ toast('เบราว์เซอร์นี้ไม่รองรับการขอสิทธิ์ กรุณาใช้เบราว์เซอร์อื่น', true); return; }
  const entry = {
    id: uid(), didHash: state.didHash, name,
    dept: u.reqDept || '',
    requestedRole: u.reqRole,
    requestedTechName: u.reqRole === 'tech' ? u.reqTechName : '',
    note: (u.reqNote || '').trim(),
    roles: [], techName: '', status: 'pending',
    at: nowIso(), decidedAt: '', decidedBy: '',
  };
  u.reqSending = true; render();
  const ok = await saveAccessRequests(list => {
    const idx = list.findIndex(r => r.didHash === state.didHash);
    if(idx >= 0) list[idx] = entry; else list.push(entry);
    return list;
  });
  u.reqSending = false;
  if(!ok){ toast('ส่งคำขอไม่สำเร็จ กรุณาลองใหม่', true); render(); return; }
  state.myRequest = entry;
  state.authStatus = 'pending';
  render();
  toast('ส่งคำขอเรียบร้อย รอผู้ดูแลอนุมัติ');
  await tryLineWebhook('admin',
    `🔐 มีคำขอสิทธิ์เข้าใช้งานใหม่\n` +
    `ชื่อ: ${name}\n` +
    `แผนก: ${entry.dept || '-'}\n` +
    `บทบาทที่ขอ: ${ROLES[entry.requestedRole].label}` +
    (entry.requestedTechName ? `\nชื่อช่าง: ${entry.requestedTechName}` : '') +
    (entry.note ? `\nหมายเหตุ: ${entry.note}` : '') +
    `\n\nกดอนุมัติได้ที่หน้า "ตั้งค่าข้อมูลหลัก" → คำขอสิทธิ์เข้าใช้งาน\n${APP_URL}`);
}
async function cancelMyAccessRequest(){
  const ok = await saveAccessRequests(list => list.filter(r => r.didHash !== state.didHash));
  if(!ok){ toast('ยกเลิกคำขอไม่สำเร็จ', true); return; }
  const mine = state.myRequest;
  if(mine){
    state.ui.reqName = mine.name || '';

    state.ui.reqRole = mine.requestedRole || 'requester';
    state.ui.reqTechName = mine.requestedTechName || '';
    state.ui.reqNote = mine.note || '';
  }
  state.myRequest = null;
  state.authStatus = 'guest';
  render();
}
async function approveAccessRequest(id){
  const req = state.accessRequests.find(r => r.id === id);
  if(!req) return;
  const roles = (state.ui.grantRole[id] && state.ui.grantRole[id].length) ? state.ui.grantRole[id] : [req.requestedRole];
  if(!roles.length || !roles.every(r => ROLES[r])){ toast('กรุณาเลือกบทบาทอย่างน้อย 1 บทบาท', true); return; }
  // บทบาท tech ต้องผูกกับชื่อช่างที่ตรงกับชีต "ช่าง" เป๊ะๆ ไม่งั้นจะไม่เห็นปุ่มเริ่ม/จบงานของตัวเอง
  const techName = roles.includes('tech') ? (state.ui.grantTechName[id] || req.requestedTechName || '') : '';
  if(roles.includes('tech') && !techName){ toast('กรุณาเลือกชื่อช่างให้ตรงกับรายชื่อในชีต "ช่าง"', true); return; }
  const ok = await saveAccessRequests(list => {
    const t = list.find(r => r.id === id);
    if(!t) return null;
    t.status = 'approved'; t.roles = roles; t.techName = techName;
    t.decidedAt = nowIso();
    t.decidedBy = ROLES[state.role] ? ROLES[state.role].label : 'ผู้ดูแลระบบ';
    return list;
  });
  if(!ok){ toast('บันทึกไม่สำเร็จ กรุณาลองใหม่', true); return; }
  toast(`อนุมัติ ${req.name} เป็น "${roles.map(r => ROLES[r].label).join(', ')}" แล้ว`);
  render();
}
async function rejectAccessRequest(id){
  const req = state.accessRequests.find(r => r.id === id);
  if(!req) return;
  if(!confirm(`ปฏิเสธคำขอสิทธิ์ของ "${req.name}" ?`)) return;
  const ok = await saveAccessRequests(list => {
    const t = list.find(r => r.id === id);
    if(!t) return null;
    t.status = 'rejected'; t.roles = []; t.techName = '';
    t.decidedAt = nowIso();
    t.decidedBy = ROLES[state.role] ? ROLES[state.role].label : 'ผู้ดูแลระบบ';
    return list;
  });
  if(!ok){ toast('บันทึกไม่สำเร็จ กรุณาลองใหม่', true); return; }
  toast('ปฏิเสธคำขอแล้ว');
  render();
}
async function revokeAccessRequest(id){
  const req = state.accessRequests.find(r => r.id === id);
  if(!req) return;
  if(!confirm(`ถอนสิทธิ์และลบรายการของ "${req.name}" ?\n\nผู้ใช้รายนี้จะกลับไปอยู่ในสถานะยังไม่มีสิทธิ์ และขอสิทธิ์ใหม่ได้`)) return;
  const ok = await saveAccessRequests(list => list.filter(r => r.id !== id));
  if(!ok){ toast('ลบไม่สำเร็จ กรุณาลองใหม่', true); return; }
  toast('ลบรายการแล้ว');
  render();
}
async function copyText(text, okMsg){
  try{
    await navigator.clipboard.writeText(text);
    toast(okMsg || 'คัดลอกแล้ว');
  }catch(e){
    // สำรองสำหรับเบราว์เซอร์/บริบทที่ยังไม่รองรับ Clipboard API
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast(okMsg || 'คัดลอกแล้ว'); }
    catch(e2){ toast('คัดลอกไม่สำเร็จ กรุณาคัดลอกด้วยตัวเอง', true); }
    ta.remove();
  }
}
async function storeSet(key, val){
  try{
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ key, value: JSON.stringify(val) })
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return true;
  }catch(e){ console.error('storage set failed', key, e); return false; }
}

async function loadAll(){
  const [cfg, counters, orders, notifs, lineUsers, lineUserRoles] = await Promise.all([
    storeGet('config'), storeGet('counters'), storeGet('orders'), storeGet('notifications'),
    storeGet('lineUsers'), storeGet('lineUserRoles')
  ]);

  if(!state.config.lineWebhooks) state.config.lineWebhooks = {};
  state.counters = counters || {};
  state.orders = orders || [];
  state.notifications = notifs || [];
  state.lineUsers = Array.isArray(lineUsers) ? lineUsers : [];
  state.lineUserRoles = (lineUserRoles && typeof lineUserRoles === 'object') ? lineUserRoles : {};
  state.loaded = true;
  // เขียน config เริ่มต้นกลับไปเฉพาะตอนเซิร์ฟเวอร์ตอบว่า "ยังไม่มี config เลยจริงๆ" (cfg === null)
  // ห้ามเขียนทับตอนแค่ดึงข้อมูลไม่สำเร็จ (cfg === undefined เช่น deploy ใหม่ยังไม่พร้อม/เน็ตหลุด)
  // มิฉะนั้นจะเผลอเขียนทับ config จริงบนเซิร์ฟเวอร์ (เช่น lineWebhooks ที่ตั้งไว้) ด้วยค่า default ว่างๆ
  // ชั้นป้องกันเพิ่ม: ให้เขียนได้เฉพาะ admin และต้องกดยืนยันก่อนเสมอ ห้าม auto-write เงียบๆ
  // อีกต่อไป — บทบาทอื่นข้ามไปเฉยๆ (ใช้ default ในเครื่องสำหรับ session นี้พอ ไม่ persist)
  if(cfg === null){
    if(state.role === 'admin' && confirm('เซิร์ฟเวอร์ยังไม่มีข้อมูลตั้งค่า (config) เลย — ต้องการเริ่มต้นค่าเริ่มต้นใหม่หรือไม่?\n\nกด "ยกเลิก" หากไม่แน่ใจ เพื่อป้องกันการเขียนทับข้อมูลเดิม (เช่น LINE Webhook) โดยไม่ตั้งใจ')){
      await storeSet('config', state.config);
    } else {
      console.warn('ข้าม auto-seed config เริ่มต้น (ยังไม่ยืนยัน หรือไม่ใช่ admin)');
    }
  }
}

/* ============================= UTIL ============================= */
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2)); }
// รองรับข้อมูลเก่าที่ยังเป็น assignment.technician (string เดี่ยว) ก่อนเปลี่ยนเป็น technicians (array)
function assignedTechs(o){
  if(o.assignment.technicians && o.assignment.technicians.length) return o.assignment.technicians;
  if(o.assignment.technician) return [o.assignment.technician];
  return [];
}
function nowIso(){ return new Date().toISOString(); }
function fmtDateTime(iso){
  const d = new Date(iso);
  return d.toLocaleString('th-TH', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' });
}
function fmtDate(dstr){
  if(!dstr) return '-';
  const d = new Date(dstr+'T00:00:00');
  return d.toLocaleDateString('th-TH', { day:'2-digit', month:'2-digit', year:'2-digit' });
}
function yyNow(){ return String(new Date().getFullYear() % 100).padStart(2,'0'); }
function previewDocNumber(deptCode){
  if(!deptCode) return 'xx---/'+yyNow();
  const yy = yyNow();
  const last = (state.counters[deptCode] && state.counters[deptCode][yy]) || 0;
  return deptCode + String(last+1).padStart(3,'0') + '/' + yy;
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg, isErr){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err':'');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2600);
}
/* หา LINE userId ของผู้รับสำหรับบทบาทหนึ่งๆ จากตารางที่ admin กำหนดไว้ในหน้าตั้งค่า
   รองรับทั้งบทบาทของระบบ (fm/gm/maint/tech/requester/admin) และ "ชื่อช่าง" ที่ใช้ยิงปิงส่วนตัว */
function lineRecipientsForRole(role){
  const map = state.lineUserRoles || {};
  return Object.keys(map).filter(userId => {
    const m = map[userId] || {};
    return (m.roles || []).includes(role) || (m.techName && m.techName === role);
  });
}
async function tryLineWebhook(role, message){
  const hooks = state.config.lineWebhooks || {};
  const url = hooks[role] || Object.values(hooks).find(Boolean);
  if(!url) return;
  // ส่ง userIds ไปด้วยเพื่อให้สคริปต์ LINE relay ยิงตรงถึงคนที่ admin กำหนดไว้ได้
  // (ถ้า relay เวอร์ชันเก่ายังไม่รองรับฟิลด์นี้ ก็จะถูกมองข้ามไปเฉยๆ พฤติกรรมเดิมไม่เปลี่ยน)
  const userIds = lineRecipientsForRole(role);
  try{
    await fetch(url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ role, message, userIds, at: nowIso() }) });
  }catch(e){ console.warn('LINE relay webhook not reachable (check URL / CORS):', e); }
}

/* ============================= PHOTO HANDLING ============================= */
function resizeImageFile(file, maxW){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function handlePhotoInput(files){
  const remaining = 5 - state.form.photos.length;
  if(remaining <= 0){ toast('แนบรูปได้สูงสุด 5 รูปต่อใบแจ้งซ่อม', true); return; }
  const list = Array.from(files).slice(0, remaining);
  for(const f of list){
    if(!f.type.startsWith('image/')) continue;
    try{
      const dataUrl = await resizeImageFile(f, 900);
      state.form.photos.push(dataUrl);
    }catch(e){ console.error(e); }
  }
  render();
}

async function submitOrder(){
  const f = state.form;
  if(!f.dept){ toast('กรุณาเลือกแผนก', true); return; }
  if(!f.docType){ toast('กรุณาเลือกประเภทเอกสาร', true); return; }
  if(!f.machineCode){ toast('กรุณาเลือกรหัสเครื่องจักร', true); return; }
  if(!f.cause || !f.cause.trim()){ toast('กรุณาระบุอาการ/สาเหตุที่ต้องการแจ้งซ่อม', true); return; }
  if(!f.neededDate){ toast('กรุณาระบุวันที่ต้องการใช้งาน', true); return; }
  if(!f.requestedBy || !f.requestedBy.trim()){ toast('กรุณาระบุชื่อผู้แจ้ง', true); return; }

  // re-fetch counters right before incrementing to reduce race window
  const freshCounters = await storeGet('counters');
  const counters = freshCounters || state.counters;
  const yy = yyNow();
  const deptCounters = { ...(counters[f.dept] || {}) };
  const next = (deptCounters[yy] || 0) + 1;
  deptCounters[yy] = next;
  const newCounters = { ...counters, [f.dept]: deptCounters };
  const docNumber = f.dept + String(next).padStart(3,'0') + '/' + yy;

  const id = uid();
  const order = {
    id, docNumber, department: f.dept, docType: f.docType, machineCode: f.machineCode, machineName: f.machineName,
    cause: f.cause.trim(), neededDate: f.neededDate, requestedBy: f.requestedBy.trim(),
    createdAt: nowIso(), status: 'PENDING_FM', photoCount: f.photos.length,
    approvals: { fm:{status:null,by:'',at:'',note:''}, gm:{status:null,by:'',at:'',note:''} },
    assignment: { technicians:[], assignedBy:'', assignedAt:'', startDate:'', endDate:'', executionPlan:'', receivedByName:'' },
    maintRecord: null,
    verification: null,
    verificationHistory: [],
    statusHistory: [{ status:'PENDING_FM', at: nowIso(), note:'สร้างใบแจ้งซ่อม โดย ' + f.requestedBy.trim() }],
  };
  const newOrders = [order, ...state.orders];

  // เขียน "orders" ก่อน — นี่คือข้อมูลตัวจริงของใบแจ้งซ่อม ต้องสำเร็จก่อนถึงจะถือว่าส่งคำร้องได้จริง
  // ห้ามอัปเดต state.orders/แสดงข้อความสำเร็จถ้า storeSet ล้มเหลว (เช่น deploy สิทธิ์ผิด, เน็ตหลุด)
  // มิฉะนั้นผู้ใช้จะเห็นว่า "ส่งเรียบร้อย" ทั้งที่ข้อมูลไม่เข้าชีตจริง
  const ordersOk = await storeSet('orders', newOrders);
  if(!ordersOk){
    toast('ส่งใบแจ้งซ่อมไม่สำเร็จ (เชื่อมต่อฐานข้อมูลไม่ได้) กรุณาลองใหม่อีกครั้ง', true);
    return;
  }
  state.orders = newOrders;
  state.counters = newCounters;
  storeSet('counters', newCounters); // best-effort, ไม่บล็อกเพราะใบแจ้งซ่อมถูกบันทึกแล้ว
  if(f.photos.length){
    const photosOk = await storeSet('photos:'+id, f.photos);
    if(!photosOk) toast('บันทึกรูปภาพแนบไม่สำเร็จ แต่ใบแจ้งซ่อมถูกบันทึกแล้ว', true);
  }

  await pushNotification('fm', id, docNumber, `มีใบแจ้งซ่อมใหม่จากแผนก ${f.dept} รอการอนุมัติของท่าน`);

  state.form = emptyForm();
  toast(`ส่งใบแจ้งซ่อมเรียบร้อย เลขที่เอกสาร ${docNumber}`);
  state.view = 'list';
  render();
}

function confirmAction(id){
  const o = getOrder(id); if(!o) return;
  const type = state.ui.actionType;
  const note = state.ui.actionNote.trim();
  if(type !== 'approve' && type !== 'verify_pass' && !note){ toast('กรุณาระบุหมายเหตุ', true); return; }
  if(o.status === 'PENDING_FM'){
    if(type==='approve') approveFm(id, note);
    else if(type==='reject') rejectFm(id, note);
    else if(type==='needinfo') needInfoFm(id, note);
  } else if(o.status === 'PENDING_GM'){
    if(type==='approve') approveGm(id, note);
    else if(type==='reject') rejectGm(id, note);
    else if(type==='needinfo') needInfoGm(id, note);
  } else if((o.status === 'NEEDS_INFO_FM' || o.status === 'NEEDS_INFO_GM') && type === 'resubmit'){
    resubmitInfo(id, note);
  } else if(o.status === 'PENDING_VERIFY' && (type === 'verify_pass' || type === 'verify_fail')){
    verifyRepair(id, type, note);
  }
}

/* ============================= REQUESTER VERIFICATION (ตรวจสอบผลการซ่อม) ============================= */
async function verifyRepair(id, type, note){
  const o = getOrder(id); if(!o) return;
  const n = (note||'').trim();
  if(type === 'verify_pass'){
    o.status = 'DONE';
    o.verification = { result:'pass', by:o.requestedBy, at: nowIso(), note:n };
    o.statusHistory.push({ status:'DONE', at: nowIso(), note:'ผู้แจ้งซ่อมตรวจสอบแล้ว: ผ่าน ใช้งานได้ปกติ' + (n ? ' — หมายเหตุ: ' + n : '') });
    await persistOrders();
    await pushNotification('maint', id, o.docNumber, `ผู้แจ้งซ่อมตรวจสอบแล้ว งานซ่อมแผนก ${o.department} ผ่าน ปิดงานเรียบร้อย`);
    for(const tech of assignedTechs(o)){
      await tryLineWebhook(tech, `[${o.docNumber}] ผู้แจ้งซ่อมตรวจสอบแล้ว งานซ่อมของคุณผ่าน ปิดงานเรียบร้อย ขอบคุณสำหรับการซ่อม${n ? '\nหมายเหตุจากผู้แจ้ง: ' + n : ''}\n${orderDeepLink(o.id, 'tech')}`);
    }
    toast('ยืนยันผลการซ่อมเรียบร้อย ปิดงาน');
  } else {
    if(!n){ toast('กรุณาระบุสาเหตุที่ต้องซ่อมเพิ่มเติม', true); return; }
    o.status = 'ASSIGNED';
    o.verification = { result:'fail', by:o.requestedBy, at: nowIso(), note:n };
    o.verificationHistory = [...(o.verificationHistory||[]), o.verification];
    o.statusHistory.push({ status:'ASSIGNED', at: nowIso(), note:'ผู้แจ้งซ่อมตรวจสอบแล้ว: ไม่ผ่าน ต้องซ่อมเพิ่มเติม เนื่องจาก ' + n });
    await persistOrders();
    const techs = assignedTechs(o);
    await pushNotification('maint', id, o.docNumber, `ผู้แจ้งซ่อมตรวจสอบพบว่างานซ่อมแผนก ${o.department} ไม่ผ่าน ต้องซ่อมเพิ่มเติม เนื่องจาก ${n}`);
    for(const tech of techs){
      await tryLineWebhook(tech, `[${o.docNumber}] ผู้แจ้งซ่อมตรวจสอบพบว่างานซ่อมไม่ผ่าน ต้องดำเนินการซ่อมเพิ่มเติม\nสาเหตุ: ${n}\n${orderDeepLink(o.id, 'tech')}`);
    }
    toast('ส่งกลับเพื่อซ่อมเพิ่มเติมแล้ว');
  }
  closeActionBox();
}

// บทบาท "tech" หนึ่งบัญชี LINE อาจผูกกับชื่อช่างได้หลายคน (เช่น บัญชีทดสอบ) จึงต้องขยาย
// รายการตัวเลือกให้เห็นชื่อช่างแต่ละคนแยกกัน ค่า option จึงเป็น "tech|<index>" สำหรับ tech
// และเป็น role key เฉยๆ สำหรับบทบาทอื่น
function roleOptionList(){
  const opts = [];
  state.allowedRoles.forEach(r => {
    if(r === 'tech' && state.techIdentities.length > 1){
      state.techIdentities.forEach((name, i) => {
        opts.push({ value:`tech|${i}`, label:`${ROLES.tech.icon} ${ROLES.tech.label} — ${name}` });
      });
    } else if(r === 'tech'){
      const name = state.techIdentities[0];
      opts.push({ value:'tech|0', label:`${ROLES.tech.icon} ${ROLES.tech.label}` + (name ? ` — ${name}` : '') });
    } else {
      opts.push({ value:r, label:`${ROLES[r].icon} ${ROLES[r].label}` });
    }
  });
  return opts;
}
function currentRoleValue(){
  if(state.role === 'tech'){
    const idx = state.techIdentities.indexOf(state.myTechName);
    return `tech|${idx >= 0 ? idx : 0}`;
  }
  return state.role;
}
function setRole(value){
  const [key, idxStr] = String(value).split('|');
  if(!state.allowedRoles.includes(key)) return;
  state.role = key; state.ui.actionFor=null; state.ui.actionType=null; state.ui.actionNote='';
  if(key === 'tech'){
    state.myTechName = state.techIdentities[parseInt(idxStr, 10) || 0] || '';
  }
  if(state.view==='settings' && state.role!=='admin') state.view='list';
  render();
}
function setView(v){
  if(v==='settings' && state.role!=='admin') return;
  state.view = v; render();
}

/* ============================= RENDER: NOTIFICATIONS ============================= */
async function markAllRead(){
  state.notifications.forEach(n => { if(state.role==='admin' || n.toRole===state.role) n.read = true; });
  await storeSet('notifications', state.notifications);
  render();
}
function renderNotif(){
  // admin เห็นการแจ้งเตือนของทุกบทบาทรวมกัน (ตรงกับ "เข้าถึงทุกฟังก์ชัน")
  const mine = state.role === 'admin' ? state.notifications : state.notifications.filter(n => n.toRole === state.role);
  const items = mine.map(n => `
    <div class="notif-item ${n.read?'':'unread'}">
      <div class="notif-icon">🔔</div>
      <div>
        <div class="notif-text">
          ${state.role==='admin' ? `<span class="status-pill" style="color:#6b7785; background:#eef0f2; margin-right:6px;">${ROLES[n.toRole] ? ROLES[n.toRole].label : n.toRole}</span>` : ''}
          <b class="mono">${n.docNumber}</b> — ${escapeHtml(n.message)}
        </div>
        <div class="notif-time">${fmtDateTime(n.createdAt)}</div>
      </div>
    </div>`).join('');
  return `
  <h2 class="view-title">การแจ้งเตือน — ${ROLES[state.role].label}</h2>
  <p class="view-sub">${state.role==='admin' ? 'การแจ้งเตือนในระบบของทุกบทบาทรวมกัน' : 'การแจ้งเตือนในระบบสำหรับบทบาทนี้'} (พร้อมส่งต่อไปยัง LINE หากตั้งค่า Webhook ไว้ในหน้าตั้งค่า)</p>
  ${mine.length ? `<div style="margin-bottom:12px;"><button class="btn btn-outline btn-sm" onclick="markAllRead()">ทำเครื่องหมายว่าอ่านแล้วทั้งหมด</button></div>` : ''}
  ${mine.length ? items : `<div class="empty-state"><div class="big">📭</div>ยังไม่มีการแจ้งเตือนสำหรับบทบาทนี้</div>`}
  `;
}

/* ============================= RENDER: SETTINGS ============================= */
function toggleGrantRole(id, defaultRoles, role, checked){
  const cur = state.ui.grantRole[id] || defaultRoles.slice();
  state.ui.grantRole[id] = checked ? [...new Set([...cur, role])] : cur.filter(r => r !== role);
  render();
}
function pendingAccessCount(){ return state.accessRequests.filter(r => r.status === 'pending').length; }

      </div>` : ''}

      </div>
    </div>`;
  }).join('');

  const decidedRows = decided.map(r => {
    const granted = (r.roles || []).map(k => ROLES[k] ? ROLES[k].label : k).join(', ');
    const pill = r.status === 'approved'
      ? `<span class="status-pill" style="color:#2F8F6B; background:#e6f3ee;">อนุมัติแล้ว</span>`
      : `<span class="status-pill" style="color:#B5433A; background:#fbeae8;">ปฏิเสธ</span>`;

      <td>${escapeHtml(r.name)}${r.techName ? `<div style="font-size:11.5px; color:var(--slate);">${escapeHtml(r.techName)}</div>` : ''}</td>

      <td>${pill}${granted ? ` <span style="font-size:12px;">${escapeHtml(granted)}</span>` : ''}</td>
      <td><button class="del" onclick="revokeAccessRequest('${r.id}')">ถอนสิทธิ์/ลบ</button></td>
    </tr>`;
  }).join('');

  return `
  <div class="settings-section card">
    <h3>คำขอสิทธิ์เข้าใช้งาน ${pending.length ? `<span class="status-pill" style="color:var(--navy); background:var(--amber);">${pending.length} รายการใหม่</span>` : ''}</h3>

    ${pending.length ? pendingCards : `<p class="desc" style="margin:0;">ไม่มีคำขอที่รออนุมัติ</p>`}
    ${decided.length ? `
    <h3 style="margin-top:20px;">ผู้ใช้ที่พิจารณาแล้ว</h3>
    <table class="mini">
      <tr><th>ชื่อ</th><th>แผนก</th><th>สถานะ / บทบาท</th><th></th></tr>
      ${decidedRows}

    <p class="desc" style="margin:10px 0 0; font-size:12px;">หมายเหตุ: ผู้ใช้ที่ผู้ดูแลพิมพ์แถวไว้ในชีต <b>สิทธิ์ผู้ใช้ LINE</b> เองจะไม่แสดงในตารางนี้ — จัดการได้ที่ชีตโดยตรง</p>` : ''}
  </div>
  `;
}

/* ============================= ADMIN: กำหนดบทบาทให้ผู้ใช้ LINE ============================= */
async function saveLineUserRole(userId){
  const id = String(userId || '').trim();
  if(!id){ toast('ไม่พบ LINE userId', true); return; }
  const cur = state.lineUserRoles[id] || {};
  const role = state.ui.lineRole[id] !== undefined ? state.ui.lineRole[id] : ((cur.roles || [])[0] || '');
  const techName = state.ui.lineTechName[id] !== undefined ? state.ui.lineTechName[id] : (cur.techName || '');
  if(role && !ROLES[role]){ toast('บทบาทไม่ถูกต้อง', true); return; }
  if(role === 'tech' && !techName){ toast('กรุณาเลือกชื่อช่างให้ตรงกับชีต "ช่าง"', true); return; }
  const known = state.lineUsers.find(u => u.userId === id);
  const next = Object.assign({}, state.lineUserRoles);
  if(!role){
    delete next[id];   // ไม่เลือกบทบาท = ยกเลิกการกำหนด
  } else {
    next[id] = {
      name: (state.ui.lineName[id] || cur.name || (known && known.displayName) || '').trim(),
      roles: [role],
      techName: role === 'tech' ? techName : '',
    };
  }
  if(!await storeSet('lineUserRoles', next)){ toast('บันทึกไม่สำเร็จ กรุณาลองใหม่', true); return; }
  state.lineUserRoles = next;
  toast(role ? `กำหนด "${ROLES[role].label}" แล้ว` : 'ยกเลิกการกำหนดบทบาทแล้ว');
  render();
}
async function addLineUserManually(){
  const id = (state.ui.newLineUserId || '').trim();
  const name = (state.ui.newLineUserName || '').trim();
  if(!id){ toast('กรุณากรอก LINE userId', true); return; }
  if(state.lineUsers.some(u => u.userId === id)){ toast('มีผู้ใช้รายนี้ในรายการอยู่แล้ว', true); return; }
  const next = state.lineUsers.concat([{ userId:id, displayName:name || '(เพิ่มด้วยตัวเอง)', lastSeen:nowIso() }]);
  if(!await storeSet('lineUsers', next)){ toast('บันทึกไม่สำเร็จ กรุณาลองใหม่', true); return; }
  state.lineUsers = next;
  state.ui.newLineUserId = ''; state.ui.newLineUserName = '';
  toast('เพิ่มผู้ใช้ LINE แล้ว — เลือกบทบาทให้เขาได้เลย');
  render();
}

        <label class="field-label">ชื่อช่าง (เลือกชื่อของท่านจากรายชื่อช่าง) <span class="req-star">*</span></label>
        <select class="input" onchange="state.ui.reqTechName=this.value">
          <option value="">— กรุณาเลือก —</option>
          ${techOpts}
        </select>
        <p class="desc" style="font-size:12px; color:var(--slate); margin:6px 0 0;">ต้องเลือกให้ตรงกับชื่อตัวเอง ระบบใช้ชื่อนี้ตรวจว่างานไหนเป็นงานที่มอบหมายให้ท่าน</p>
      </div>` : ''}
      <div class="field">
        <label class="field-label">หมายเหตุถึงผู้ดูแล</label>
        <input class="input" value="${escapeHtml(u.reqNote)}" oninput="state.ui.reqNote=this.value" placeholder="เช่น เบอร์ติดต่อ หรือข้อมูลยืนยันตัวตน">
      </div>
      <button class="btn btn-primary btn-block" onclick="submitAccessRequest()" ${u.reqSending ? 'disabled' : ''}>
        ${u.reqSending ? 'กำลังส่งคำขอ...' : 'ส่งคำขอสิทธิ์'}
      </button>
    </div>
    ${renderAdminBootstrap()}`);
}
function renderPendingAccess(){
  const r = state.myRequest || {};
  return renderAuthShell(`
    <div class="card" style="text-align:center;">
      <div style="font-size:44px;">⏳</div>
      <h2 class="view-title" style="margin-top:6px;">ส่งคำขอแล้ว รอผู้ดูแลอนุมัติ</h2>
      <p class="view-sub" style="margin-bottom:16px;">ผู้ดูแลระบบได้รับแจ้งเตือนทาง LINE แล้ว เมื่ออนุมัติหน้านี้จะเข้าระบบให้เองโดยท่านไม่ต้องทำอะไร (ไม่ต้องปิดหน้านี้)</p>
      <table class="mini" style="text-align:left;">
        <tr><th>ชื่อ</th><td>${escapeHtml(r.name || '-')}</td></tr>
        <tr><th>แผนก</th><td>${escapeHtml(r.dept || '-')}</td></tr>
        <tr><th>บทบาทที่ขอ</th><td>${ROLES[r.requestedRole] ? escapeHtml(ROLES[r.requestedRole].label) : '-'}</td></tr>
        ${r.requestedTechName ? `<tr><th>ชื่อช่าง</th><td>${escapeHtml(r.requestedTechName)}</td></tr>` : ''}
        <tr><th>ส่งเมื่อ</th><td>${r.at ? escapeHtml(fmtDateTime(r.at)) : '-'}</td></tr>
      </table>
      <div class="order-actions" style="margin-top:14px; justify-content:center;">
        <button class="btn btn-outline btn-sm" onclick="recheckAccess()">ตรวจสอบสถานะตอนนี้</button>
        <button class="btn btn-outline btn-sm" onclick="cancelMyAccessRequest()">แก้ไข / ยกเลิกคำขอ</button>
      </div>
    </div>
    ${renderAdminBootstrap()}`);
}
function renderRejectedAccess(){
  const r = state.myRequest || {};
  return renderAuthShell(`
    <div class="card" style="text-align:center;">
      <div style="font-size:44px;">🚫</div>
      <h2 class="view-title" style="margin-top:6px;">คำขอสิทธิ์ไม่ได้รับการอนุมัติ</h2>
      <p class="view-sub">คำขอของ "${escapeHtml(r.name || '-')}" ถูกปฏิเสธโดยผู้ดูแลระบบ หากเข้าใจว่าเป็นความเข้าใจผิด กรุณาติดต่อผู้ดูแลระบบ แล้วส่งคำขอใหม่ได้</p>
      <button class="btn btn-outline btn-sm" onclick="cancelMyAccessRequest()">ส่งคำขอใหม่</button>
    </div>`);
}

/* ============================= MAIN RENDER ============================= */
function render(){
  const app = document.getElementById('app');
  if(state.authStatus === 'loading'){
    app.innerHTML = `<div style="padding:60px; text-align:center; color:var(--slate);">กำลังตรวจสอบสิทธิ์ผู้ใช้งาน...</div>`;
    return;
  }
  if(state.authStatus === 'guest'){ app.innerHTML = renderRequestAccess(); return; }
  if(state.authStatus === 'pending'){ app.innerHTML = renderPendingAccess(); return; }
  if(state.authStatus === 'rejected'){ app.innerHTML = renderRejectedAccess(); return; }
  if(!state.loaded){
    app.innerHTML = `<div style="padding:60px; text-align:center; color:var(--slate);">กำลังโหลดระบบ...</div>`;
    return;
  }
  const active = document.activeElement;
  const fid = active && app.contains(active) ? active.getAttribute('data-fid') : null;
  const selStart = fid && 'selectionStart' in active ? active.selectionStart : null;
  const selEnd = fid && 'selectionEnd' in active ? active.selectionEnd : null;

  let body = '';
  if(state.view==='new') body = renderNew();
  else if(state.view==='list') body = renderList();
  else if(state.view==='detail') body = renderDetail();
  else if(state.view==='notif') body = renderNotif();
  else if(state.view==='settings') body = state.role==='admin' ? renderSettings() : renderList();
  const updateBanner = state.updateAvailable ? `
    <div class="update-banner">
      🔄 มีการอัปเดตระบบเวอร์ชันใหม่ — กรุณารีเฟรชหน้าเพื่อใช้งานเวอร์ชันล่าสุด
      <button class="btn btn-primary btn-sm" onclick="location.reload()">รีเฟรชตอนนี้</button>
    </div>` : '';
  app.innerHTML = updateBanner + renderHeader() + `<main>${body}</main>`;

  if(fid){
    const restored = app.querySelector(`[data-fid="${fid}"]`);
    if(restored){
      restored.focus();
      if(selStart != null && restored.setSelectionRange){
        try{ restored.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

/* ============================= LIVE POLLING (near real-time sync) ============================= */
async function pollForUpdates(){
  try{
    const [cfg, orders, notifs, reqs, lineUsers, lineUserRoles] = await Promise.all([
      storeGet('config'), storeGet('orders'), storeGet('notifications'), storeGet('accessRequests'),
      storeGet('lineUsers'), storeGet('lineUserRoles')
    ]);
    let changed = false;
    if(lineUsers && JSON.stringify(lineUsers) !== JSON.stringify(state.lineUsers)){ state.lineUsers = lineUsers; changed = true; }
    if(lineUserRoles && JSON.stringify(lineUserRoles) !== JSON.stringify(state.lineUserRoles)){ state.lineUserRoles = lineUserRoles; changed = true; }
    if(cfg && JSON.stringify(cfg) !== JSON.stringify(state.config)){ state.config = cfg; changed = true; }
    if(orders && JSON.stringify(orders) !== JSON.stringify(state.orders)){ state.orders = orders; changed = true; }
    if(notifs && JSON.stringify(notifs) !== JSON.stringify(state.notifications)){ state.notifications = notifs; changed = true; }
    // คำขอสิทธิ์: ให้ admin เห็นคำขอใหม่สดๆ และถ้าสิทธิ์ของตัวเองถูกแก้/ถอนระหว่างใช้งานก็ปรับตามทันที
    if(reqs && JSON.stringify(reqs) !== JSON.stringify(state.accessRequests)){
      const grantSig = r => r ? `${r.status}|${(r.roles || []).join(',')}|${r.techName || ''}` : '';
      const before = grantSig(state.myRequest);
      state.accessRequests = reqs;
      state.myRequest = requestFor(state.didHash, reqs);
      if(grantSig(state.myRequest) !== before){
        await resolveAccess();   // สิทธิ์อาจยังเหลือจากชีตอยู่ จึงต้องประเมินใหม่ทั้งสองแหล่ง
        if(state.authStatus !== 'ok'){ location.reload(); return; }
      }
      changed = true;
    }
    if(changed) render();
  }catch(e){ /* silent - next poll retries */ }
}

/* แท็บที่เปิดค้างไว้นานจะยังรันโค้ด JS เดิมในหน่วยความจำต่อไปเรื่อยๆ แม้ index.html บนเซิร์ฟเวอร์จะอัปเดตแล้ว
   (เช่น ปุ่มกดต่างๆ จะยังส่งแจ้งเตือนแบบไม่มี deep link) จึงต้องดึงไฟล์ล่าสุดมาเทียบเวอร์ชันเป็นระยะ
   แล้วเตือนให้ผู้ใช้รีเฟรชเอง แทนที่จะรีโหลดอัตโนมัติ (จะได้ไม่ขัดจังหวะระหว่างกรอกฟอร์ม) */
async function checkForUpdate(){
  if(state.updateAvailable) return;
  try{
    const res = await fetch(location.pathname + '?_v=' + Date.now(), { cache:'no-store' });
    const text = await res.text();
    const m = text.match(/const APP_VERSION\s*=\s*'([^']+)'/);
    if(m && m[1] !== APP_VERSION){
      state.updateAvailable = true;
      render();
    }
  }catch(e){ /* ignore - next check retries */ }
}

/* ============================= INIT ============================= */
/* รองรับลิงก์ลึกจากการแจ้งเตือน LINE: ?order=<id>&role=<role> เปิดตรงไปที่ใบแจ้งซ่อมนั้น
   และสลับบทบาทให้ตรงกับผู้รับแจ้งเตือน (ถ้าบัญชีนี้มีสิทธิ์บทบาทนั้นจริง) */
(async function init(){
  await authenticate();
  render();
  if(state.authStatus !== 'ok'){
    // ยังไม่มีสิทธิ์ — คอยเช็คให้เอง พอผู้ดูแลกดอนุมัติแล้วหน้านี้จะเข้าระบบทันทีโดยผู้ใช้ไม่ต้องกดอะไร
    setInterval(recheckAccess, 7000);
    document.addEventListener('visibilitychange', () => { if(!document.hidden) recheckAccess(); });
    return;
  }
  await loadAll();

  const params = new URLSearchParams(location.search);
  const linkOrderId = params.get('order');
  const linkRole = params.get('role');
  if(linkRole && state.allowedRoles.includes(linkRole)){
    state.role = linkRole;
    if(linkRole === 'tech') state.myTechName = state.techIdentities[0] || '';
  }
  if(linkOrderId && getOrder(linkOrderId)){
    history.replaceState(null, '', location.pathname);
    await openDetail(linkOrderId);
  } else {
    render();
  }
  setInterval(pollForUpdates, 3000);
  setInterval(checkForUpdate, 120000);
  // รีเฟรชทันทีเมื่อผู้ใช้กลับมาที่แท็บนี้ (สลับแท็บ/แอปแล้วกลับมา) แทนที่จะรอรอบ poll ถัดไป
  document.addEventListener('visibilitychange', () => { if(!document.hidden) pollForUpdates(); });
})();
</script>
